name: Temporary Estonia Option Localization Upload

on:
  push:
    branches: [tmp-shopify-et-options-20260905]
    paths: ['.github/workflows/internal-link-audit.yml']

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload variables to Shopify staged storage
        run: |
          STATUS=$(curl --silent --show-error --output upload-response.txt --write-out '%{http_code}' \
            --request POST 'https://shopify-staged-uploads.storage.googleapis.com/' \
            --form 'Content-Type=text/jsonl' \
            --form 'success_action_status=201' \
            --form 'acl=private' \
            --form 'key=tmp/60808888570/bulk/6bb1593a-2e43-498a-9b5d-23c93928b5de/decords-et-options-next100-20260905.jsonl' \
            --form 'x-goog-date=20260905T123852Z' \
            --form 'x-goog-credential=merchant-assets@shopify-tiers.iam.gserviceaccount.com/20260905/auto/storage/goog4_request' \
            --form 'x-goog-algorithm=GOOG4-RSA-SHA256' \
            --form 'x-goog-' \
            --form '' \
            --form 'file=@tmp_shopify_et_mutations.jsonl;type=text/jsonl')
          printf '%s\n' "$STATUS" > tmp_shopify_upload_status.txt
          cat upload-response.txt >> tmp_shopify_upload_status.txt
          test "$STATUS" = '201'
      - name: Commit upload status
        run: |
          git config user.name "Decords Audit Bot"
          git config user.email "audit-bot@decords.com"
          git add tmp_shopify_upload_status.txt
          git commit -m "Record Shopify staged upload status"
          git push
