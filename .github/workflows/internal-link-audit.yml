name: Temporary Estonia Option Localization Preparation

on:
  push:
    branches: [tmp-shopify-et-options-20260905]
    paths: ['.github/workflows/internal-link-audit.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare localization variables
        env:
          EXPORT_URL: https://cdn.shopify.com/s/files/1/0608/0888/8570/files/af03431cdb07bead9a9b6140377a?v=1788611292
        run: |
          python - <<'PY'
          import hashlib,json,os,re,urllib.request
          from pathlib import Path
          MARKET='gid://shopify/Market/90602078546'
          raw=urllib.request.urlopen(os.environ['EXPORT_URL'],timeout=60).read().decode()
          products=[]
          for line in raw.splitlines():
              if not line.strip(): continue
              obj=json.loads(line)
              if isinstance(obj,dict) and str(obj.get('id','')).startswith('gid://shopify/Product/'):
                  products.append(obj)
          def existing_ok(items,value):
              return any(t.get('key')=='name' and t.get('value')==value and t.get('outdated') is False for t in (items or []))
          def is_inch_option(name):
              low=(name or '').lower()
              return any(w in low for w in ('size','width','height','length','diameter','dimension')) and ('(in' in low or 'inch' in low or low.endswith(' in')) and 'cm' not in low
          def translated_option(name):
              low=(name or '').lower()
              if 'complete size' in low: return 'Valmis mõõt'
              if 'design width' in low: return 'Kujunduse laius'
              if 'decal height' in low: return 'Kleebise kõrgus'
              if 'diameter' in low: return 'Läbimõõt'
              if 'width' in low: return 'Laius'
              if 'height' in low: return 'Kõrgus'
              if 'length' in low: return 'Pikkus'
              if 'dimension' in low: return 'Mõõdud'
              return 'Mõõt'
          def convert(value):
              src=(value or '').strip(); low=src.lower()
              if ('cm' in low or 'centimeter' in low) and ('inch' in low or re.search(r'\bin\b',low) or '"' in src): return None,'both'
              m=re.match(r'^(\d+(?:\.\d+)?)\s*[x×X]\s*(\d+(?:\.\d+)?)\s*(.*)$',src)
              if m:
                  suffix=m.group(3).strip(); suffix=re.sub(r'\bsample\b','näidis',suffix,flags=re.I)
                  return f"{int(float(m.group(1))*2.54+.5)} × {int(float(m.group(2))*2.54+.5)} cm"+(' '+suffix if suffix else ''),'ok'
              m=re.match(r'^(\d+(?:\.\d+)?)\s*(?:inches|inch|in|\")?\s*(.*)$',src,re.I)
              if m:
                  suffix=m.group(2).strip(); suffix=re.sub(r'\bsample\b','näidis',suffix,flags=re.I)
                  return f"{int(float(m.group(1))*2.54+.5)} cm"+(' '+suffix if suffix else ''),'ok'
              return None,'skip'
          changes=[]; stats={'productsChecked':len(products),'activePublished':0,'skippedProducts':0,'sizeOptionsChecked':0,'sizeValuesChecked':0,'bothUnitsSkipped':0,'alreadyCorrect':0}
          for product in products:
              if not (product.get('status')=='ACTIVE' and (product.get('onlineStoreUrl') or product.get('publishedAt'))):
                  stats['skippedProducts']+=1; continue
              stats['activePublished']+=1
              for option in product.get('options') or []:
                  source=str(option.get('name') or '')
                  if not is_inch_option(source): continue
                  stats['sizeOptionsChecked']+=1; expected=translated_option(source)
                  if existing_ok(option.get('translations'),expected): stats['alreadyCorrect']+=1
                  else: changes.append({'resourceId':option['id'],'translations':[{'locale':'et','key':'name','value':expected,'translatableContentDigest':hashlib.sha256(source.encode()).hexdigest(),'marketId':MARKET}],'productId':product['id'],'kind':'option'})
                  for value in option.get('optionValues') or []:
                      if value.get('hasVariants') is False: continue
                      source=str(value.get('name') or ''); expected,state=convert(source)
                      if state=='both': stats['bothUnitsSkipped']+=1; continue
                      if state!='ok': continue
                      stats['sizeValuesChecked']+=1
                      if existing_ok(value.get('translations'),expected): stats['alreadyCorrect']+=1
                      else: changes.append({'resourceId':value['id'],'translations':[{'locale':'et','key':'name','value':expected,'translatableContentDigest':hashlib.sha256(source.encode()).hexdigest(),'marketId':MARKET}],'productId':product['id'],'kind':'value'})
          Path('tmp_shopify_et_mutations.jsonl').write_text('\n'.join(json.dumps({'resourceId':c['resourceId'],'translations':c['translations']},ensure_ascii=False,separators=(',',':')) for c in changes)+'\n',encoding='utf-8')
          stats.update({'firstProductId':products[0]['id'],'lastProductId':products[-1]['id'],'changesPlanned':len(changes),'optionChanges':sum(c['kind']=='option' for c in changes),'valueChanges':sum(c['kind']=='value' for c in changes),'expected':{c['resourceId']:c['translations'][0]['value'] for c in changes}})
          Path('tmp_shopify_et_manifest.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit temporary outputs
        run: |
          git config user.name "Decords Audit Bot"
          git config user.email "audit-bot@decords.com"
          git add tmp_shopify_et_manifest.json tmp_shopify_et_mutations.jsonl
          git commit -m "Add temporary Estonia option localization plan"
          git push
