name: Build split Pigu Words feed

on:
  workflow_dispatch:
  push:
    paths:
      - "pigu/split_words_feed.py"
      - ".github/workflows/build-split-pigu-words.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests lxml
      - run: python pigu/split_words_feed.py
      - name: Validate output
        run: |
          python - <<'PY'
          from lxml import etree
          p='pigu/PiguProducts-batch-001-split-words-16-products.xml'
          r=etree.parse(p)
          assert len(r.findall('.//product'))==16
          assert len(r.findall('.//modification'))==22
          print('validated')
          PY
      - name: Commit generated XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pigu/PiguProducts-batch-001-split-words-16-products.xml
          if ! git diff --cached --quiet; then
            git commit -m "Generate split-size Pigu pilot feed"
            git push
          fi
