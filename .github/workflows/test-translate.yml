name: Test translation endpoint

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-translate.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Google translate endpoint
        run: |
          python - <<'PY'
          import requests
          url = "https://translate.googleapis.com/translate_a/single"
          params = {"client":"gtx","sl":"en","tl":"lt","dt":"t","q":"Gray kitten wall sticker"}
          r = requests.get(url, params=params, timeout=30)
          print(r.status_code)
          print(r.text)
          r.raise_for_status()
          PY
