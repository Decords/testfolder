name: PHH compact gallery evidence 20261015
on:
  push:
    paths: [.github/workflows/phh-gallery-compact-20261015.yml]
permissions:
  contents: read
  actions: read
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phh-gallery-evidence-20261015
          run-id: 38734082833
          github-token: ${{ github.token }}
          path: evidence
      - uses: actions/upload-artifact@v4
        with:
          name: phh-gallery-compact-20261015
          path: |
            evidence/current_public_source.jsonl.gz
            evidence/preview_checks.json
            evidence/summary.json
            evidence/contact_sheets/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: phh-gallery-originals-selected-20261015
