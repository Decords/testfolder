name: Publish validated PHH full feeds
on:
  push:
    branches: [main]
    paths:
      - pigu/full_20261012/publish_request.json
permissions:
  contents: write
concurrency:
  group: phh-feed-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml requests
      - run: python pigu/full_20261012/publish_feeds.py
      - name: Commit both feeds together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pigu/PHH_PRODUCTS_FULL.xml pigu/PHH_STOCK_PRICES.xml pigu/full_20261012/publication_status.json pigu/full_20261012/before_full_publication
          git commit -m 'Publish full PHH content and matching EUR offers, stock 999, collection 120 hours'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify public files from the published commit
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,requests
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          audit=json.loads(Path('pigu/full_20261012/build_audit.json').read_text())
          for name,field in [('PHH_PRODUCTS_FULL.xml','content_sha256'),('PHH_STOCK_PRICES.xml','offers_sha256')]:
              url=f'https://raw.githubusercontent.com/Decords/testfolder/{sha}/pigu/{name}'
              r=requests.get(url,timeout=180);r.raise_for_status()
              assert hashlib.sha256(r.content).hexdigest()==audit[field]
              print(name,'public HTTP',r.status_code,'bytes',len(r.content),'SHA256 verified')
          PY
