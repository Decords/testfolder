name: Build Pigu batch 001 XML

on:
  push:
    paths:
      - 'pigu/build_batch001.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build XML
        run: python pigu/build_batch001.py
      - name: Commit generated XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pigu/PiguProducts-batch-001.xml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build Pigu batch 001 XML"
          git push
