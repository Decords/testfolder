name: Build Pigu batch 002

on:
  workflow_dispatch:
  push:
    paths:
      - "pigu/bulk_url.txt"
      - "pigu/PiguProducts-batch-001.xml"
      - "pigu/PiguPrices-batch-001.xml"
      - ".github/workflows/build-pigu-batch500.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests lxml openpyxl

      - name: Recover and patch verified generator
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Decords/testfolder/8cb13d2a1503d3b97ff6669bc612318c60772f5f/pigu/build_pigu_batch500.py" -o /tmp/build_pigu_batch500_packed.py
          python - <<'PY'
          import ast
          import base64
          import re
          import zlib
          from pathlib import Path

          wrapper = Path('/tmp/build_pigu_batch500_packed.py').read_text(encoding='utf-8')
          module = ast.parse(wrapper)
          strings = [node.value for node in ast.walk(module) if isinstance(node, ast.Constant) and isinstance(node.value, str)]
          encoded = max(strings, key=len)
          source = zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          pattern = re.compile(r'^    image_urls = \[\n.*?^    \]\n    if not image_urls:', flags=re.MULTILINE | re.DOTALL)
          replacement = '''    image_urls = [
              str(image.get("url") or "")
              for img in product.get("_images", [])
              if isinstance(img, dict)
              for image in [img.get("image")]
              if isinstance(image, dict) and image.get("url")
          ]
              if not image_urls:'''
          patched, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise RuntimeError(f'Expected one media block replacement, got {count}')
          compile(patched, '/tmp/build_pigu_batch500.py', 'exec')
          Path('/tmp/build_pigu_batch500.py').write_text(patched, encoding='utf-8')
          print('Recovered and patched generator:', len(patched), 'characters')
          PY

      - name: Build cumulative product and price feeds
        run: |
          python /tmp/build_pigu_batch500.py \
            --bulk-url-file pigu/bulk_url.txt \
            --existing-products pigu/PiguProducts-batch-001.xml \
            --existing-prices pigu/PiguPrices-batch-001.xml \
            --output-dir pigu/generated \
            --target 500

      - name: Validate generated XML
        run: |
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          for filename in ["PiguProducts-master.xml", "PiguProducts-batch-002-new-only.xml", "PiguPrices-master.xml"]:
              path = Path("pigu/generated") / filename
              root = etree.parse(str(path)).getroot()
              assert root.tag == "products", (filename, root.tag)
              print(filename, "OK", path.stat().st_size, "bytes")
          PY

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pigu/generated
          if ! git diff --cached --quiet; then
            git commit -m "Build Pigu batch 002 cumulative feeds"
            git push
          fi

      - name: Upload generated package
        uses: actions/upload-artifact@v4
        with:
          name: pigu-batch-002
          path: pigu/generated/
          if-no-files-found: error
          retention-days: 30
