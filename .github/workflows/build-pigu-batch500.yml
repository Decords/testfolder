name: Build Pigu batch 002

on:
  workflow_dispatch:
  push:
    paths:
      - "pigu/bulk_url.txt"
      - "pigu/build_pigu_batch500.py"
      - "pigu/PiguProducts-batch-001.xml"
      - "pigu/PiguPrices-batch-001.xml"
      - ".github/workflows/build-pigu-batch500.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests lxml openpyxl

      - name: Build cumulative product and price feeds
        run: |
          python pigu/build_pigu_batch500.py \
            --bulk-url-file pigu/bulk_url.txt \
            --existing-products pigu/PiguProducts-batch-001.xml \
            --existing-prices pigu/PiguPrices-batch-001.xml \
            --output-dir pigu/generated \
            --target 500

      - name: Validate generated XML
        run: |
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          for filename in ["PiguProducts-master.xml", "PiguProducts-batch-002-new-only.xml", "PiguPrices-master.xml"]:
              path = Path("pigu/generated") / filename
              root = etree.parse(str(path)).getroot()
              assert root.tag == "products", (filename, root.tag)
              print(filename, "OK", path.stat().st_size, "bytes")
          PY

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pigu/generated
          if ! git diff --cached --quiet; then
            git commit -m "Build Pigu batch 002 cumulative feeds"
            git push
          fi

      - name: Upload generated package
        uses: actions/upload-artifact@v4
        with:
          name: pigu-batch-002
          path: pigu/generated/
          if-no-files-found: error
          retention-days: 30
