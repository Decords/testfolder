name: PHH full catalog preparation 20261012
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phh-full-catalog-20261012.yml
      - pigu/full_20261012/build_full.py
permissions:
  contents: write
concurrency:
  group: phh-full-catalog-20261012
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests lxml
      - name: Build and validate complete feed
        id: build
        run: |
          if test -f pigu/full_20261012/build_full.py; then python pigu/full_20261012/build_full.py; fi
      - name: Preserve cache, reports and successfully validated outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pigu/full_20261012
          if ! git diff --cached --quiet; then
            git commit -m 'Update PHH full catalog build results and translation cache'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phh-full-catalog-20261012
          path: pigu/full_20261012/
          retention-days: 14
          if-no-files-found: error
